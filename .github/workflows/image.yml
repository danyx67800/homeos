name: Build appliance images

# Images are big and slow to build, so this does not run on every push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the image'
        required: false
        default: 'dev'
      publish:
        description: 'Attach the images to a draft release (they are discarded otherwise)'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release these artefacts attach to

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Free arm64 hosted runners are available to public repositories.
          # If this label is ever unavailable, the job fails loudly rather than
          # silently producing an amd64 binary with an arm64 name.
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version || 'dev' }}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building HomeOS ${V} for ${{ matrix.arch }}"

      - name: Confirm the runner is the architecture it claims
        run: |
          # A silent fallback to an amd64 runner would produce an image named
          # arm64 that boots on nothing.
          want='${{ matrix.arch }}'
          got="$(dpkg --print-architecture)"
          echo "runner architecture: ${got}, wanted: ${want}"
          [ "$got" = "$want" ] || {
            echo "::error::runner is ${got} but this job builds ${want}"
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install image build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-common \
            mtools dosfstools gdisk parted rsync xz-utils file \
            qemu-utils
          # grub-mkrescue needs the GRUB modules for the target it produces, and
          # those ship as per-architecture packages: installing the arm64 set on
          # an amd64 runner fails. The chroot installs its own GRUB separately,
          # so this is only for the ISO.
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install -y -qq --no-install-recommends \
              grub-pc-bin grub-efi-amd64-bin
          else
            sudo apt-get install -y -qq --no-install-recommends \
              grub-efi-arm64-bin
          fi
          # The boot test needs an emulator and UEFI firmware for the target.
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf
          else
            sudo apt-get install -y -qq --no-install-recommends qemu-system-arm qemu-efi-aarch64
          fi

      - name: Build the backend and the dashboard
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Built on the runner, not in the chroot: cross-compiling a static Go
          # binary is faster and keeps a compiler out of the image.
          ( cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "../dist/homeos-core-linux-${{ matrix.arch }}" ./cmd/homeos-core )
          ( cd web && npm ci && npm run build )
          ls -la dist/ web/dist/index.html

      - name: Build the root filesystem
        run: sudo image/build-rootfs.sh "${{ matrix.arch }}" "${{ runner.temp }}/rootfs"

      - name: Build the disk image
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          NAME="homeos-${VERSION}-${{ matrix.arch }}"
          sudo image/build-disk.sh "${{ matrix.arch }}" "${{ runner.temp }}/rootfs" "dist/${NAME}.img"
          echo "IMG_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Compress and checksum the image
        run: |
          set -euo pipefail
          # -T0 uses every core the runner has; the image is the slowest step
          # in this workflow and it compresses well.
          sudo chown "$(id -u):$(id -g)" "dist/${IMG_NAME}.img"
          xz -T0 -6 "dist/${IMG_NAME}.img"
          ( cd dist && sha256sum "${IMG_NAME}.img.xz" > "${IMG_NAME}.img.xz.sha256" )
          ls -lh dist/

      - name: Build the installer ISO
        env:
          HOMEOS_VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          sudo -E image/build-iso.sh "${{ matrix.arch }}" \
              "dist/${IMG_NAME}.img.xz" "dist/${IMG_NAME}.iso"
          sudo chown "$(id -u):$(id -g)" "dist/${IMG_NAME}.iso"
          ( cd dist && sha256sum "${IMG_NAME}.iso" > "${IMG_NAME}.iso.sha256" )
          ls -lh dist/

      - name: Check the artefacts are what they claim to be
        run: |
          set -euo pipefail
          # A file(1) check catches the failure mode that matters: an image that
          # built without error but has no partition table or no boot sector.
          file "dist/${IMG_NAME}.iso"
          xz -t "dist/${IMG_NAME}.img.xz" && echo "  xz stream intact"
          file "dist/${IMG_NAME}.iso" | grep -qi 'ISO 9660' \
            || { echo "::error::the ISO is not an ISO 9660 image"; exit 1; }

      - name: Boot the image and check the dashboard answers
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # An image that builds is not an image that boots. This is the only
          # check that exercises the bootloader, the kernel, first boot, and
          # every service actually coming up — which is exactly the ground
          # where a build-only pipeline ships something broken.
          IMG="${{ runner.temp }}/boot-test.img"
          xzcat "dist/${IMG_NAME}.img.xz" > "$IMG"
          # Room for the root filesystem to grow into, as it would on real
          # hardware; a full disk on first boot is its own failure mode.
          qemu-img resize -f raw "$IMG" 8G

          case "${{ matrix.arch }}" in
            amd64)
              FW=/usr/share/OVMF/OVMF_CODE.fd
              [ -f "$FW" ] || FW=/usr/share/ovmf/OVMF.fd
              QEMU=(qemu-system-x86_64 -machine q35 -cpu max -bios "$FW")
              ;;
            arm64)
              FW=/usr/share/AAVMF/AAVMF_CODE.fd
              [ -f "$FW" ] || FW=/usr/share/qemu-efi-aarch64/QEMU_EFI.fd
              QEMU=(qemu-system-aarch64 -machine virt -cpu max -bios "$FW")
              ;;
          esac
          # KVM when the runner offers it, TCG when it does not. Nested
          # virtualisation is not guaranteed on hosted runners.
          [ -w /dev/kvm ] && QEMU+=(-enable-kvm) && echo "using KVM" || echo "using TCG (slower)"

          "${QEMU[@]}" -m 2048 -smp 2 -display none -no-reboot \
            -drive "file=${IMG},format=raw,if=virtio" \
            -netdev "user,id=n0,hostfwd=tcp::8080-:80,hostfwd=tcp::2222-:22" \
            -device virtio-net-pci,netdev=n0,romfile= \
            -serial file:"${{ runner.temp }}/boot.log" \
            -daemonize -pidfile "${{ runner.temp }}/qemu.pid"

          echo "Waiting for the dashboard..."
          ok=0
          for i in $(seq 1 200); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/api/v1/health >/tmp/health.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 10
            # Show what the machine is doing, so a hang reads differently from
            # a slow boot without waiting out the whole timeout.
            [ $((i % 6)) -eq 0 ] && echo "  ${i}0s - console: $(tail -1 "${{ runner.temp }}/boot.log" 2>/dev/null)"
          done

          echo "::group::serial console"
          tail -120 "${{ runner.temp }}/boot.log" || true
          echo "::endgroup::"

          kill "$(cat "${{ runner.temp }}/qemu.pid")" 2>/dev/null || true

          if [ "$ok" != "1" ]; then
            # Mount the image the VM was just running and read its journal. The
            # serial console only shows what systemd chose to print; the journal
            # says which unit failed and why, which is the difference between
            # diagnosing this and guessing at it.
            echo "::group::inside the image that did not answer"
            LOOP="$(sudo losetup --find --show --partscan "$IMG")"
            sleep 2
            sudo mkdir -p /mnt/probe
            if sudo mount "${LOOP}p2" /mnt/probe 2>/dev/null; then
              echo "--- failed and warning-level units ---"
              sudo journalctl -D /mnt/probe/var/log/journal --no-pager -p warning -n 100 \
                2>/dev/null || echo "(no persistent journal on the image)"
              echo "--- units enabled for multi-user ---"
              ls /mnt/probe/etc/systemd/system/multi-user.target.wants/ 2>/dev/null || true
              echo "--- resolv.conf ---"
              ls -l /mnt/probe/etc/resolv.conf 2>/dev/null || true
              sudo umount /mnt/probe || true
            else
              echo "could not mount the root partition to look inside"
            fi
            sudo losetup -d "$LOOP" 2>/dev/null || true
            echo "::endgroup::"

            echo "::error::nothing answered on port 80 before the timeout"
            exit 1
          fi
          echo "Dashboard answered:"
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json \
            || { echo "::error::/api/v1/health did not report ok"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: homeos-${{ matrix.arch }}
          # Only the checksums. The image and the ISO are ~1 GB per
          # architecture, which would exhaust the Actions storage quota in a
          # couple of runs; they go to a release instead, where they do not
          # count against it.
          path: |
            dist/*.sha256
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          draft: true
          files: |
            dist/*.img.xz
            dist/*.img.xz.sha256
            dist/*.iso
            dist/*.iso.sha256

      - name: Say where the artefacts went
        if: always()
        run: |
          {
            echo "### HomeOS ${{ steps.v.outputs.version }} — ${{ matrix.arch }}"
            echo
            if [ -f "dist/${IMG_NAME}.iso" ]; then
              echo "| Artefact | Size |"
              echo "|---|---|"
              for f in "dist/${IMG_NAME}.img.xz" "dist/${IMG_NAME}.iso"; do
                [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
              echo
            fi
            if [ "${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}" = "true" ]; then
              echo "Attached to the **draft release**: <${{ github.server_url }}/${{ github.repository }}/releases>"
              echo
              echo "It is a draft, so it is only visible to you until you publish it."
            else
              echo "> **Not published.** \`publish\` was false, so these were built,"
              echo "> verified and then discarded with the runner. Re-run with"
              echo "> \`publish\` enabled to keep them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
