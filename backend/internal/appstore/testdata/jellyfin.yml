manifestVersion: 1
id: jellyfin
name: Jellyfin
tagline: Media server that puts you in control
description: |
  Jellyfin streams your own films, series and music to any device on the
  network. Nothing is uploaded and nothing phones home.
category: media
version: "10.9.11"
icon: jellyfin.svg
website: https://jellyfin.org
developer: Jellyfin Contributors
license: GPL-2.0

architectures: [amd64, arm64]

image: jellyfin/jellyfin:10.9.11
port: 8096
route: host

env:
  - key: TZ
    label: Timezone
    type: string
    default: Etc/UTC
  - key: JELLYFIN_PublishedServerUrl
    label: Published URL
    description: The address clients should use to reach this server.
    type: string
    default: http://jellyfin.local
    advanced: true

volumes:
  - name: config
    path: /config
  - name: cache
    path: /cache
  - hostPath: /mnt/storage/media
    path: /media
    readOnly: true

devices:
  - /dev/dri

resources:
  memory: 2g
  cpus: "2.0"

healthcheck:
  test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 3
