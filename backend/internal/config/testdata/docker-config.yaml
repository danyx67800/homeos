# Configuration for the containerised stack. Paths match the image layout, not
# an appliance's.
version: 1

system:
  hostname: homenas
  domain: local
  timezone: Etc/UTC

api:
  # 0.0.0.0 inside the container only: nothing publishes this port, Caddy is
  # the only route in. On an appliance this stays on loopback.
  listen: 0.0.0.0
  port: 8790
  session_ttl_hours: 168

paths:
  config: /etc/homeos
  apps: /var/lib/homeos/apps
  data: /var/lib/homeos/data
  store: /var/lib/homeos/store
  database: /var/lib/homeos/db/homeos.db
  backups: /var/lib/homeos/backups
  logs: /var/log/homeos
  storage_root: /mnt/storage
  web_root: /opt/homeos/web

docker:
  socket: /var/run/docker.sock
  edge_network: homeos-edge
  app_subnet_pool: 10.21.0.0/16
  app_subnet_size: 24
  compose_project_prefix: homeos

proxy:
  engine: caddy
  admin_endpoint: http://caddy:2019
  routes_dir: /etc/homeos/proxy/routes.d
  default_route_mode: port
  publish_mdns_aliases: false

storage:
  mount_root: /mnt/storage
  default_filesystem: ext4
  smart_poll_interval_minutes: 30

samba:
  workgroup: WORKGROUP
  managed_config: /etc/homeos/samba/shares.conf
  share_group: homeos-share

appstore:
  repository: https://github.com/danyx67800/homeos-appstore.git
  branch: main
  refresh_interval_hours: 12

telemetry:
  sample_interval_seconds: 2
  history_retention_minutes: 60

update:
  # Off in containers: the update model swaps a symlink and restarts a systemd
  # unit, neither of which exists here. Rebuild the image instead.
  channel_url: ""
  auto_check: false
